[package]
name = "mcpg-plugin-credential-oauth-token-exchange"
version = "0.1.0-alpha.41"
license = "BUSL-1.1"
edition = "2024"
description = "OAuth 2.0 token-exchange credential_issuer plugin for MCPG (RFC 8693)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mcpg-plugin-protocol = { git = "https://github.com/mcpg-dev/mcpg-plugin-protocol", tag = "v0.1.0-beta.39", version = "=0.1.0-beta.39" }
mcpg-plugin-sdk = { git = "https://github.com/mcpg-dev/mcpg-plugin-sdk", tag = "v0.1.0-beta.40", version = "=0.1.0-beta.40" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# private_key_jwt client assertions. aws_lc_rs is the rustls-clean backend the
# other in-tree JWT users pin; use_pem enables the PEM key loaders.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics = "0.24"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
tracing = "0.1"
url = "2.5.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
wiremock = "0.6"

[features]
default = ["cdylib-export"]
cdylib-export = []
static-firstparty = []
